[package]
name = "netavail-core"
description = "Network availability algorithms: path sets, cut sets, availability"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Runs node pairs on rayon's thread pool; off for wasm, which has no threads (D17)
parallel = ["dep:rayon"]

[dependencies]
blake3.workspace = true
thiserror.workspace = true
rayon = { version = "1.11", optional = true }

[dev-dependencies]
proptest.workspace = true
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Reads the reference topologies; a dev-dependency cycle is allowed by cargo
netavail-io.workspace = true

[[bench]]
name = "reference"
harness = false
