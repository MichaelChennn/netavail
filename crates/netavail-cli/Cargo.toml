[package]
name = "netavail-cli"
description = "Command line for netavail: list algorithms, run, verify against reference answers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "netavail"
path = "src/main.rs"

[dependencies]
netavail-core.workspace = true
netavail-io.workspace = true
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
