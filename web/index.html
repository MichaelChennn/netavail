<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>netavail demo</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header>
      <h1>netavail <span class="tag">demo</span></h1>
      <p>Two-terminal network availability in the browser: Rust compiled to WebAssembly, running in a Web Worker.</p>
    </header>

    <main>
      <section class="controls">
        <label>Topology
          <select id="topology"></select>
        </label>
        <label class="file">or import JSON
          <input id="file" type="file" accept=".json,application/json" />
        </label>
        <div id="topo-info" class="muted"></div>

        <label>Paths <select id="paths"></select></label>
        <label>Cuts <select id="cuts"></select></label>
        <label>Availability <select id="avail"></select></label>
        <label>Node availability p (one scenario each; "file" uses each node's own prob)
          <input id="probs" value="0.9, 0.99, 0.999, 0.9999" />
        </label>
        <label>Link availability (empty: links never fail; "file" uses each edge's own prob)
          <input id="link-prob" placeholder="e.g. 0.99 or file" />
        </label>

        <div class="buttons">
          <button id="run" class="primary">Run all pairs</button>
          <button id="reevaluate" title="Evaluate cached pairs with new p values">Re-evaluate</button>
          <button id="cancel" disabled>Cancel</button>
        </div>
        <progress id="progress" value="0" max="1"></progress>
        <div id="status" class="muted" role="status"></div>
      </section>

      <section class="results">
        <div class="table-wrap">
          <table id="table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
        <aside id="detail" hidden>
          <h2 id="detail-title"></h2>
          <div id="detail-body"></div>
        </aside>
      </section>
    </main>

    <footer class="muted">
      Times are measured in this browser (its clock has about 0.1 ms resolution) and only
      compare algorithms on the same machine.
      <a href="https://github.com/MichaelChennn/netavail">Source</a>
    </footer>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
